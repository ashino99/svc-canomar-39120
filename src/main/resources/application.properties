spring.application.name=svc-canomar
# En la nube el puerto lo asigna el servidor (variable PORT); en la PC es 8080.
server.port=${PORT:8080}
# Detrás del proxy HTTPS de la nube: respeta la dirección pública.
server.forward-headers-strategy=framework

# ---- Base de datos MySQL 8 ----
# La base se crea sola la primera vez (createDatabaseIfNotExist).
# Cambie la contraseña por la de su usuario root de MySQL, o use la variable de entorno DB_PASSWORD.
# En la nube se usa la variable DB_URL; en la PC, la base local.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/svc_canomar?createDatabaseIfNotExist=true&serverTimezone=America/Lima&useUnicode=true&characterEncoding=UTF-8}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:root}
# Cierra las conexiones sin uso para que el servidor pueda "dormir" cuando nadie usa el sistema.
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.idle-timeout=60000
spring.datasource.hikari.maximum-pool-size=5

# Crea las tablas (schema.sql) y carga los datos de demostración (data.sql) en cada arranque, sin duplicar.
spring.sql.init.mode=always
spring.sql.init.continue-on-error=false
# En la nube se cargan solo los datos iniciales (usuarios, configuración y productos), sin ventas de prueba.
spring.sql.init.data-locations=${DATOS_SQL:classpath:data.sql}

# ---- Vistas ----
spring.thymeleaf.cache=${THYMELEAF_CACHE:false}
spring.mvc.format.date=yyyy-MM-dd

# ---- Sesión y seguridad ----
server.servlet.session.timeout=8h
server.servlet.session.cookie.http-only=true
server.error.include-stacktrace=never

# ---- Archivos subidos / descargas ----
spring.servlet.multipart.max-file-size=5MB

# Tipo de archivo del manifiesto de la PWA
server.mime-mappings.webmanifest=application/manifest+json
